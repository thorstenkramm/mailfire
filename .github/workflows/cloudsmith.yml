name: Cloudsmith

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable GitHub release (e.g. v0.1.0)
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      CLOUDSMITH_API_KEY:
        required: true

permissions:
  contents: read

concurrency:
  group: cloudsmith-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Cloudsmith CLI
        run: |
          python3 -m venv "$RUNNER_TEMP/cloudsmith"
          "$RUNNER_TEMP/cloudsmith/bin/pip" install cloudsmith-cli==1.29.0
          echo "$RUNNER_TEMP/cloudsmith/bin" >> "$GITHUB_PATH"
      - name: Publish verified release packages
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDSMITH_API_KEY: ${{ secrets.CLOUDSMITH_API_KEY }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 packaging/cloudsmith/publish.py "$RELEASE_TAG"

  install:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        image: ['debian:13', 'ubuntu:24.04', 'fedora:44']
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install from signed public repository
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/packaging/cloudsmith:/smoke:ro" \
            "$IMAGE" bash /smoke/smoke-test.sh "${RELEASE_TAG#v}"
