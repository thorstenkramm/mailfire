name: Docs

# Builds the documentation site (Hugo, docs/) on every change and deploys it
# to GitHub Pages (https://mailfire.system42.io) from main. Pull requests only
# build, so a broken page or link fails before it is merged.

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mailfire.example.conf
      - Makefile
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mailfire.example.conf
      - Makefile
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; never cancel a deployment in progress.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.168.0

jobs:
  build:
    name: build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for "Last updated" dates

      - name: Install Hugo
        run: |
          set -euo pipefail
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          archive="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${archive}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          mkdir -p hugo && tar -xzf "$archive" -C hugo hugo
          echo "$RUNNER_TEMP/hugo" >> "$GITHUB_PATH"

      - name: Install mandoc
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mandoc

      - name: Build
        run: |
          hugo version
          make docs

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/public

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
