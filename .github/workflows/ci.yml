name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: lint, duplication and security (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Package publisher checks
        run: |
          python3 -m unittest discover -s packaging/cloudsmith -v
          bash -n packaging/cloudsmith/smoke-test.sh

      - name: golangci-lint
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run ./...

      - name: Check duplication marker balance
        shell: bash
        run: |
          unbalanced=0
          while IFS= read -r file; do
            starts=$(grep -c 'jscpd:ignore-start' "$file" || true)
            ends=$(grep -c 'jscpd:ignore-end' "$file" || true)
            if [[ "$starts" -ne "$ends" ]]; then
              echo "::error file=$file::Unbalanced duplication markers ($starts starts, $ends ends)"
              unbalanced=1
            fi
          done < <(git ls-files -- '*.go')
          exit "$unbalanced"

      # Match run-all-tests.sh: exclude generated golden snapshots, not templates.
      - name: jscpd
        run: npx --yes jscpd@5.1.2 --config .jscpd.json --no-tips .

      - name: Trivy
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace:ro" -w /workspace \
            aquasec/trivy:0.74.0 fs . \
            --skip-dirs .agents --ignorefile .trivyignore.yaml --exit-code 1

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Relies on .gitattributes (eol=lf) so Windows checkouts are not CRLF.
      - name: gofmt
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt: files need formatting:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: staticcheck (pinned)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      - name: go test -race
        run: go test -race ./...

  coverage:
    name: coverage (>= 85%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Test infrastructure (internal/testutil) does not ship and is
      # excluded from the total.
      - name: go test -coverprofile
        run: go test -coverprofile=coverage.out $(go list ./... | grep -v /internal/testutil)

      - name: total coverage
        run: |
          go tool cover -func=coverage.out
          {
            echo '### Coverage'
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: enforce >= 85% total coverage
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          echo "total coverage: ${total}% (minimum 85%)"
          awk -v t="$total" -v min=85 'BEGIN { exit (t != "" && t + 0 >= min + 0) ? 0 : 1 }' \
            || { echo "::error::total coverage ${total}% is below 85%"; exit 1; }

      - name: upload coverage profile
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage.out
          path: coverage.out
          retention-days: 14
          if-no-files-found: ignore
