<style>
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  body { margin: 0 !important; padding: 0 !important; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
  table, td, th { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
  img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
  a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }

  /* Body content. Text colour is set once on .content and inherited,
     so colours written into --html input survive. */
  .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 { font-weight: bold; }
  .content h1 { margin: 0 0 20px; font-size: 30px; line-height: 37px; font-weight: normal; letter-spacing: -0.01em; }

  .content h3 { margin: 28px 0 8px; font-size: 19px; line-height: 26px; }
  .content h4, .content h5, .content h6 { margin: 24px 0 6px; font-size: 17px; line-height: 26px; }
  .content h5, .content h6 { font-style: italic; }
  .content p { margin: 0 0 18px; }
  .content a { color: #7a2e1f; text-decoration: underline; text-underline-offset: 2px; }
  .content ul, .content ol { margin: 0 0 18px; padding: 0 0 0 26px; }
  .content li { margin: 0 0 6px; }
  .content li p { margin: 0 0 6px; }
  .content li ul, .content li ol { margin: 6px 0 0; }
  .content blockquote { margin: 0 0 18px; padding: 0 0 0 18px; border-left: 3px solid #d6d7dc; color: #55575e; font-style: italic; }
  .content blockquote p { margin: 0 0 10px; }
  .content code { padding: 1px 5px; border-radius: 4px; background-color: #f0f1f3; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 0.88em; }
  .content pre { margin: 0 0 20px; padding: 14px 16px; border-radius: 6px; background-color: #f5f5f7; font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; font-size: 14px; line-height: 21px; white-space: pre-wrap; word-wrap: break-word; }
  .content pre code { padding: 0; border-radius: 0; background-color: transparent; font-size: 14px; }
  .content table { width: 100%; margin: 6px 0 24px; border-collapse: collapse; border-top: 2px solid #24252a; border-bottom: 2px solid #24252a; font-size: 15px; line-height: 22px; font-variant-numeric: tabular-nums; }
  .content th { padding: 8px 10px; border-bottom: 1px solid #24252a; font-weight: bold; text-align: left; vertical-align: bottom; }
  .content td { padding: 6px 10px; vertical-align: top; }
  .content th:first-child, .content td:first-child { padding-left: 0; }
  .content th:last-child, .content td:last-child { padding-right: 0; }
  .content hr { height: 0; margin: 32px 0; border: 0; border-top: 1px solid #e2e3e7; }
  .content img { max-width: 100%; height: auto; }
  .content blockquote > :last-child, .content li > :last-child { margin-bottom: 0; }

  /* GitHub Flavored Markdown alerts (internal/markdown/alerts.go). The
     selectors are deliberately specific so they win over the generic
     .content table/td/p rules when inlined. */
  .content table.alert { width: 100%; margin: 0 0 18px; border: 0; border-collapse: separate; font-size: inherit; line-height: inherit; }
  .content table.alert td.alert-body { padding: 2px 0 2px 18px; border-left: 2px solid #d6d7dc; vertical-align: top; }
  .content table.alert td.alert-body p { margin: 8px 0 0; }
  .content table.alert td.alert-body ul, .content table.alert td.alert-body ol, .content table.alert td.alert-body pre { margin: 8px 0 0; }
  .content table.alert td.alert-body p.alert-title { margin: 0; font-style: italic; }
  .content table.alert-note td.alert-body { border-left-color: #0969da; }
  .content table.alert-note td.alert-body p.alert-title { color: #0969da; }
  .content table.alert-tip td.alert-body { border-left-color: #1a7f37; }
  .content table.alert-tip td.alert-body p.alert-title { color: #1a7f37; }
  .content table.alert-important td.alert-body { border-left-color: #8250df; }
  .content table.alert-important td.alert-body p.alert-title { color: #8250df; }
  .content table.alert-warning td.alert-body { border-left-color: #9a6700; }
  .content table.alert-warning td.alert-body p.alert-title { color: #9a6700; }
  .content table.alert-caution td.alert-body { border-left-color: #d1242f; }
  .content table.alert-caution td.alert-body p.alert-title { color: #c21f2a; }

  .footer-text a { color: #62656d; text-decoration: underline; }

  @media (prefers-color-scheme: dark) {
    .body, .page { background-color: #16171a !important; }
    .card { background-color: #1e1f23 !important; }
    .content { color: #e4e5e9 !important; }
    .content a { color: #f0a58a !important; }
    .content blockquote { color: #a7aab2 !important; border-left-color: #3b3d43 !important; }
    .content code { background-color: #2a2c31 !important; }
    .content pre { background-color: #24262b !important; }
    .content pre code { background-color: transparent !important; }
    .content table, .content th { border-color: #e4e5e9 !important; }
    .content hr { border-top-color: #2e3035 !important; }
    .content table.alert-note td.alert-body { border-left-color: #4493f8 !important; }
    .content table.alert-note td.alert-body p.alert-title { color: #4493f8 !important; }
    .content table.alert-tip td.alert-body { border-left-color: #3fb950 !important; }
    .content table.alert-tip td.alert-body p.alert-title { color: #3fb950 !important; }
    .content table.alert-important td.alert-body { border-left-color: #ab7df8 !important; }
    .content table.alert-important td.alert-body p.alert-title { color: #ab7df8 !important; }
    .content table.alert-warning td.alert-body { border-left-color: #d29922 !important; }
    .content table.alert-warning td.alert-body p.alert-title { color: #d29922 !important; }
    .content table.alert-caution td.alert-body { border-left-color: #f85149 !important; }
    .content table.alert-caution td.alert-body p.alert-title { color: #f85149 !important; }
    .footer-text { color: #a7aab2 !important; border-top-color: #2e3035 !important; }
    .footer-text a { color: #a7aab2 !important; }
  }

  @media screen and (max-width: 600px) {
    .gutter { padding: 28px 18px 36px !important; }
    .card { padding: 28px 22px !important; }
    .content { font-size: 16px !important; line-height: 26px !important; }
    .content h1 { font-size: 26px !important; line-height: 32px !important; }
    .content h2 { font-size: 21px !important; line-height: 28px !important; }
  }
</style>
