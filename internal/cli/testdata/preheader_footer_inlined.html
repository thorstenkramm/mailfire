<style>

  /* Body content. Text colour is set once on .content and inherited,

  .content h1, .content h2, .content h3, .content h4, .content h5, .content h6 { font-weight: 600; }

  .content p { margin: 0 0 18px; }
  .content a { color: #2b4c7e; text-decoration: underline; text-underline-offset: 2px; }

  .content img { max-width: 100%; height: auto; }
  .content blockquote > :last-child, .content li > :last-child { margin-bottom: 0; }

  /* GitHub Flavored Markdown alerts (internal/markdown/alerts.go). The
     selectors are deliberately specific so they win over the generic
     .content table/td/p rules when inlined. */
  .content table.alert { width: 100%; margin: 0 0 18px; border: 0; border-collapse: separate; font-size: inherit; line-height: inherit; }

  .content table.alert-note td.alert-body p.alert-title { color: #0969da; }
  .content table.alert-tip td.alert-body { border-left-color: #1a7f37; background-color: #edf7f0; }
  .content table.alert-tip td.alert-body p.alert-title { color: #1a7f37; }
  .content table.alert-important td.alert-body { border-left-color: #8250df; background-color: #f4f0fd; }

  .content table.alert-warning td.alert-body { border-left-color: #9a6700; background-color: #fbf5e6; }

  .content table.alert-caution td.alert-body { border-left-color: #d1242f; background-color: #fdf0f0; }

    .content table.alert-important td.alert-body { border-left-color: #ab7df8 !important; background-color: #241a38 !important; }
    .content table.alert-important td.alert-body p.alert-title { color: #ab7df8 !important; }
    .content table.alert-warning td.alert-body { border-left-color: #d29922 !important; background-color: #2e2510 !important; }

    .content table.alert-caution td.alert-body { border-left-color: #f85149 !important; background-color: #331719 !important; }
