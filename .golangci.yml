version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - nilerr
    - staticcheck
    - unconvert
    - unused

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    misspell:
      locale: US
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
